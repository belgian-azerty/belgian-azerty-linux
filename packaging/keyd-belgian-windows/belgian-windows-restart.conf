# Installed by keyd-belgian-windows: restart keyd if it ever crashes or is killed, so Ctrl+Alt = AltGr comes back
# by itself (proven: kill -9 -> active again within 4 s). A plain "systemctl stop keyd" still stops it.
# keyd exits with status 15 on SIGTERM (signal(SIGTERM, exit)) and 2 on SIGINT. Counting those as success makes a
# "systemctl stop keyd" end as "inactive" instead of "failed"; Restart=always still restarts keyd when anything other
# than systemctl stops it (kill, kill -9, a crash).
[Service]
Restart=always
RestartSec=1
SuccessExitStatus=2 15
