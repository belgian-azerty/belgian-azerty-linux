# Runs the tests that need no virtual machine on every change to main and on every pull request, on GitHub's free
# Ubuntu 24.04 machines (each run gets a fresh machine that is thrown away afterwards). The same commands work by hand:
# see MAINTAINERS.md, "5. Testing".
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: static checks, settings logic, package build, lintian, Caps Lock table
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends shellcheck build-essential \
            debhelper devscripts lintian xorriso python3-dev python3-pip python3-cffi pkg-config libxkbcommon-dev \
            libxkbcommon-tools xkb-data
          sudo pip install --break-system-packages -q xkbcommon==1.5.1
      - name: tests/run-offline.sh
        run: bash tests/run-offline.sh

  packages:
    name: install, upgrade, trigger, purge; Ctrl+Alt rules in keyd's own test program
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools and add the keyd-team PPA (with its source packages)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential debhelper \
            devscripts lintian python3-dev python3-pip python3-cffi pkg-config libxkbcommon-dev libxkbcommon-tools \
            xkb-data software-properties-common dpkg-dev
          sudo pip install --break-system-packages -q xkbcommon==1.5.1
          sudo add-apt-repository -y -s ppa:keyd-team/ppa
          sudo apt-get update -qq
      - name: Build both packages from source
        run: bash packaging/build-all.sh
      - name: tests/pkg-cycle.sh (this machine is thrown away after the run)
        run: sudo bash tests/pkg-cycle.sh dist
      - name: tests/keyd-rules.sh against the PPA's keyd source
        run: |
          mkdir -p "$RUNNER_TEMP/keyd-src" && cd "$RUNNER_TEMP/keyd-src" && apt-get source -qq keyd
          bash "$GITHUB_WORKSPACE/tests/keyd-rules.sh" "$(find "$RUNNER_TEMP/keyd-src" -maxdepth 1 -mindepth 1 -type d -name 'keyd-*')"

  lived-in:
    name: '"take nothing away": lived-in users, in a throwaway Ubuntu 24.04 system container'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build both packages from source
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential debhelper \
            devscripts lintian
          bash packaging/build-all.sh
          mkdir -p "$RUNNER_TEMP/new" && cp dist/belgian-azerty-windows_*_all.deb dist/keyd-belgian-windows_*_all.deb "$RUNNER_TEMP/new/"
          ls -l "$RUNNER_TEMP/new"
      # be-azerty-fix treats an overlay root as a live session (no boot image to rebuild); Docker's default storage
      # gives containers an overlay root, so this job switches Docker to plain folders (vfs) first.
      - name: Start an Ubuntu 24.04 container with systemd and the desktop settings schemas
        run: |
          f=/etc/docker/daemon.json; [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          jq '. + {"storage-driver": "vfs"}' "$f" | sudo tee "$f.new" >/dev/null && sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker build -t lived-in - <<'DOCKERFILE'
          FROM ubuntu:24.04
          RUN apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              ca-certificates systemd systemd-sysv dbus dbus-user-session sudo libglib2.0-bin dconf-gsettings-backend \
              dconf-cli gsettings-desktop-schemas cinnamon-desktop-data libgnomekbd-common ibus keyboard-configuration \
              console-setup software-properties-common gpg-agent python3 xkb-data >/dev/null
          CMD ["/sbin/init"]
          DOCKERFILE
          docker run -d --name lived --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/new:/new:ro" lived-in
          docker exec lived systemctl is-system-running --wait || true
          docker exec lived findmnt -no FSTYPE /
      - name: tests/lived-in.sh
        run: docker exec lived bash -c 'cp -a /src /root/repo && bash /root/repo/tests/lived-in.sh /new'
