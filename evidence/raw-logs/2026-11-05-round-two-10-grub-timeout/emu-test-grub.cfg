	menuentry "AZERTY belge, point sur le pavé numérique" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=fr_BE.UTF-8 belgian.decimal=period"
		sleep 2; halt
	}
	menuentry "AZERTY belge, virgule sur le pavé numérique" --class linuxmint {
