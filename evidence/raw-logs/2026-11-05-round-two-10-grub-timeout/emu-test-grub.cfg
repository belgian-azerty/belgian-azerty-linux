

set color_normal=white/black
set color_highlight=black/light-gray

set default="0>0"
set timeout=10
submenu "Start Linux Mint 22.3 Cinnamon 64-bit - Nederlands (België)" --class linuxmint {
	menuentry "Belgisch AZERTY, punt op het numeriek klavier" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=nl_BE.UTF-8 belgian.decimal=period"
		sleep 2; halt
	}
	menuentry "Belgisch AZERTY, komma op het numeriek klavier" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=nl_BE.UTF-8 belgian.decimal=comma"
		sleep 2; halt
	}
}
