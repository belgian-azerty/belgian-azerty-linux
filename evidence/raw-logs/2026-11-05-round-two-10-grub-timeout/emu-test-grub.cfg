submenu "Start Linux Mint 22.3 Cinnamon 64-bit - Deutsch (Belgien)" --class linuxmint {
	menuentry "Belgisch AZERTY, Punkt auf dem Ziffernblock" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=de_BE.UTF-8 belgian.decimal=period"
		sleep 2; halt
	}
	menuentry "Belgisch AZERTY, Komma auf dem Ziffernblock" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=de_BE.UTF-8 belgian.decimal=comma"
		sleep 2; halt
	}
	menuentry "Deutsch QWERTZ" --class linuxmint {
		set gfxpayload=keep
		linux	/casper/vmlinuz  boot=casper uuid=6e72f523-dc09-4880-8910-93ffa64401c5 username=mint hostname=mint iso-scan/filename=${iso_path} quiet splash keyboard-configuration/layoutcode=de locale=de_BE.UTF-8 belgian.keyboard=de --
		sleep 2; halt
	}
}
submenu "Start Linux Mint 22.3 Cinnamon 64-bit - English" --class linuxmint {
	menuentry "Belgian AZERTY, period on the numpad" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=en_US.UTF-8 belgian.decimal=period"
		sleep 2; halt
	}
	menuentry "Belgian AZERTY, comma on the numpad" --class linuxmint {
		set gfxpayload=keep
		echo "BOOTED locale=en_US.UTF-8 belgian.decimal=comma"
		sleep 2; halt
	}
	menuentry "German QWERTZ" --class linuxmint {
		set gfxpayload=keep
		linux	/casper/vmlinuz  boot=casper uuid=6e72f523-dc09-4880-8910-93ffa64401c5 username=mint hostname=mint iso-scan/filename=${iso_path} quiet splash keyboard-configuration/layoutcode=de locale=en_US.UTF-8 belgian.keyboard=de belgian.formats=be --
		sleep 2; halt
	}
}
menuentry "Start Linux Mint 22.3 Cinnamon 64-bit (compatibility mode)" {
	linux	/casper/vmlinuz  boot=casper uuid=6e72f523-dc09-4880-8910-93ffa64401c5 username=mint hostname=mint iso-scan/filename=${iso_path} noapic noacpi nosplash irqpoll nomodeset --
		sleep 2; halt
}
menuentry "OEM install (for manufacturers)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz  oem-config/enable=true only-ubiquity boot=casper uuid=6e72f523-dc09-4880-8910-93ffa64401c5 username=mint hostname=mint iso-scan/filename=${iso_path} quiet splash --
		sleep 2; halt
}
grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'Boot from next volume' {
	exit 1
}
menuentry 'UEFI Firmware Settings' {
	fwsetup
}
menuentry 'Memory test' {
	linux	/boot/memtest.efi
}
fi
