# DRAFT, never run: for the public repository after release (GitHub only offers /dev/kvm on its free runners
# for public repositories; private ones get 2 vCPU / 8 GB and KVM is not documented there).
# Copy to .github/workflows/boot-smoke.yml. It boots the Belgian Mint ISO with KVM, types like a Belgian
# typist into a terminal and keeps the screenshots as a downloadable artifact.
name: boot-smoke
on: workflow_dispatch
jobs:
  mint-live:
    runs-on: ubuntu-24.04          # public repo: 4 vCPU, 16 GB RAM, 14 GB SSD
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pil xorriso imagemagick
      - name: Mint ISO, repacked to boot Belgian
        run: |
          curl -fL --retry 5 -o mint.iso https://mirrors.edge.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso
          echo "a081ab202cfda17f6924128dbd2de8b63518ac0531bcfe3f1a1b88097c459bd4  mint.iso" | sha256sum -c
          bash tools/make_belgian_iso.sh mint.iso mint-be.iso && rm mint.iso
      - name: Boot and type
        run: |
          cd rig
          python3 qemu_rig.py start mint --iso ../mint-be.iso --mem 4096 --smp 4 --cpu host --vga virtio
          python3 boottime.py mint ../shots 600 5
          python3 qemu_rig.py keys mint ctrl-alt-t && sleep 10
          python3 qemu_rig.py type mint --as be "azerty é@#{}[]|\€" --delay 0.25 && sleep 3
          python3 qemu_rig.py shot mint ../shots/typed.png
          python3 qemu_rig.py stop mint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
